<script>
const D = window.FDE, M = D.modules;
const KEY = "fde-study-v2", PASS = 0.8;
const blank = () => ({mods:{},review:[],days:[],steps:{},explain:{},cards:{}});
let S = load();
function load(){ try{ return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){ return blank(); } }
function save(){ const t=new Date().toISOString().slice(0,10); if(!S.days.includes(t)) S.days.push(t); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
function ms(id){ return S.mods[id] || (S.mods[id]={learn:false,quiz:null,explain:false,build:false}); }
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byId = id => M.find(x=>x.id===id);
// project/summary text may carry simple author HTML (pre, code, b, lists); plain text is escaped
const rich = s => /<[/]?(pre|code|b|i|ul|ol|li|br|a)/.test(s) ? s : esc(s);
const plain = s => String(s).replace(/<[^>]+>/g,"").replace(/&gt;/g,">").replace(/&lt;/g,"<").replace(/&amp;/g,"&");
function toast(t){ const e=$("#toast"); e.textContent=t; e.style.display="block"; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display="none",2000); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function done(id){ const m=ms(id); return m.learn && m.quiz!==null && m.quiz>=PASS && m.explain && m.build; }
function parts(id){ const m=ms(id); return [m.learn, m.quiz!==null&&m.quiz>=PASS, !!m.explain, m.build]; }
function streak(){ const set=new Set(S.days); let n=0, d=new Date(); for(;;){ const k=d.toISOString().slice(0,10); if(set.has(k)){n++; d.setDate(d.getDate()-1);} else break; } return n; }
function copy(text){ if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast("Copied. Paste it to Claude."),()=>toast("Select the text below and copy it")); } else toast("Select the text below and copy it"); }
function code(c, lang){ return c ? `<pre>${esc(c)}</pre>` : ""; }

// ---------- question engine (mc | multi | order | tf) ----------
// q: {t?, q, code?, o[], a (index | index[] | order index[]), why, lvl?}
function qtype(q){ return q.t || (Array.isArray(q.a) ? "multi" : "mc"); }
function qInit(q){ const t=qtype(q); return {t, opts: shuffle(q.o.map((_,k)=>k)), picked:[], seq:[], answered:false, right:false}; }
function qHTML(q, st, handler){
  const t=st.t;
  let h=`${q.lvl===2?'<span class="pill lvl2">stretch</span>':''}<h3>${esc(q.q)}</h3>${code(q.code)}`;
  if(t==="multi") h+=`<div class="mute">Select all that apply</div>`;
  if(t==="order") h+=`<div class="mute">Tap in the right order</div><div class="ordpick">${st.seq.map((k,i)=>`<span class="chip">${i+1}. ${esc(q.o[k])}</span>`).join("")||'<span class="mute">…</span>'}</div>`;
  h+=st.opts.map(oi=>{
    let cls="";
    if(!st.answered){ if(st.picked.includes(oi)) cls="sel"; if(t==="order"&&st.seq.includes(oi)) cls="sel"; }
    else if(t==="mc"){ if(oi===q.a) cls="ok"; else if(st.picked.includes(oi)) cls="bad"; }
    else if(t==="multi"){ const inA=q.a.includes(oi), p=st.picked.includes(oi); cls = inA&&p?"ok": (!inA&&p?"bad": (inA?"miss":"")); }
    else if(t==="order"){ cls=""; }
    const dis = st.answered || (t==="order"&&st.seq.includes(oi));
    return `<button class="btn ${cls}" ${dis?'disabled':''} onclick="${handler}(${oi})">${esc(q.o[oi])}</button>`;
  }).join("");
  if(!st.answered && t==="multi") h+=`<button class="btn primary" onclick="${handler}(-1)">Check</button>`;
  if(!st.answered && t==="order" && st.seq.length) h+=`<button class="btn ghost" onclick="${handler}(-2)">Undo</button>`;
  if(st.answered){
    let extra = t==="order" ? `<div class="mute" style="margin-top:6px">Correct order: ${q.a.map((k,i)=>`${i+1}. ${esc(q.o[k])}`).join(" → ")}</div>` : "";
    h+=`<div class="why"><b>${st.right?'✓ Right.':'✗ Not quite.'}</b> ${esc(q.why)}${extra}</div>`;
  }
  return h;
}
// returns true when the question just got answered
function qPick(q, st, oi){
  const t=st.t;
  if(st.answered) return false;
  if(t==="mc"){ st.picked=[oi]; st.answered=true; st.right=(oi===q.a); return true; }
  if(t==="multi"){ if(oi===-1){ const a=[...q.a].sort().join(), p=[...st.picked].sort().join(); st.answered=true; st.right=(a===p); return true; }
    st.picked = st.picked.includes(oi) ? st.picked.filter(x=>x!==oi) : st.picked.concat(oi); return false; }
  if(t==="order"){ if(oi===-2){ st.seq.pop(); return false; } st.seq.push(oi); if(st.seq.length===q.o.length){ st.answered=true; st.right = st.seq.join()===q.a.join(); return true; } return false; }
}

let view = {name:"home"};
function go(v){ view=v; render(); window.scrollTo(0,0); }
function tabs(){
  const t=[["home","🏠","Path"],["review","🔁","Review"],["gloss","🗂","Terms"],["tutor","💬","Tutor"],["me","📈","Progress"]];
  $("#tabs").innerHTML=t.map(([k,i,l])=>`<button class="${view.name===k||(k==='home'&&view.name==='mod')||(k==='me'&&view.name==='exam')?'on':''}" onclick="go({name:'${k}'})"><span>${i}</span>${l}</button>`).join("");
}
function render(){
  tabs();
  const v=view.name, a=$("#app");
  a.innerHTML = v==="home"?home(): v==="mod"?mod(): v==="review"?review(): v==="gloss"?gloss(): v==="tutor"?tutor(): v==="exam"?exam(): me();
}

// ---------- home ----------
function home(){
  const n=M.filter(m=>done(m.id)).length, next=M.find(m=>!done(m.id));
  const tracks=[...new Set(M.map(m=>m.track))];
  return `<h1>Claude FDE, at your pace</h1>
  <div class="mute">${M.length} modules · learn → test → explain → build</div>
  <div class="card"><div class="row" style="align-items:center"><div><div class="big">${n}/${M.length}</div><div class="mute">modules complete</div></div><div style="text-align:right"><div class="big">🔥${streak()}</div><div class="mute">day streak</div></div></div>
  <div class="bar" style="margin-top:12px"><i style="width:${n/M.length*100}%"></i></div>
  ${next?`<button class="btn primary" style="margin-top:14px" onclick="openMod('${next.id}')">Continue: ${esc(next.title)}</button>`:`<button class="btn primary" onclick="go({name:'tutor'})">All done. Start the capstone</button>`}
  ${S.review.length?`<button class="btn ghost" onclick="go({name:'review'})">🔁 ${S.review.length} question(s) to review</button>`:""}
  </div>
  ${D.intro?`<details class="card"><summary>How this works</summary>${D.intro}</details>`:""}
  ${tracks.map(tr=>`<div class="track">${esc(tr)}</div>${M.filter(m=>m.track===tr).map(m=>{const p=parts(m.id);return `<button class="btn" onclick="openMod('${m.id}')"><div class="mod"><div class="num ${done(m.id)?'done':''}">${done(m.id)?'✓':esc(m.code||m.n)}</div><div style="flex:1"><div><b>${esc(m.title)}</b></div><div class="mute">${esc(m.course||"")}${m.mins?` · ~${m.mins} min`:""}</div><div class="dots">${p.map(x=>`<b class="${x?'on':''}"></b>`).join("")}</div></div></div></button>`}).join("")}`).join("")}
  <div class="card mute">Dots = Learn · Quiz (${PASS*100}%+) · Explain · Build. The official Claude FDE courses are free to register on Anthropic's partner Skilljar. This app is a companion, not a copy.</div>`;
}
function openMod(id){ go({name:'mod',id,tab:'learn',i:-1}); }

// ---------- module ----------
function mod(){
  const m=byId(view.id), st=ms(m.id), tab=view.tab||"learn";
  const T=[["learn","Learn"],["quiz","Quiz"],["explain","Explain"],["build","Build"]];
  let body="";
  if(tab==="learn") body=learn(m,st);
  if(tab==="quiz") body=quiz(m,st);
  if(tab==="explain") body=explainV(m,st);
  if(tab==="build") body=build(m,st);
  return `<button class="back" onclick="go({name:'home'})">← Path</button><br>
  <span class="pill">${esc(m.track)}</span>${m.course?`<span class="pill">${esc(m.course)}</span>`:""}<h1>${esc(m.title)}</h1>
  <div class="row" style="margin:10px 0">${T.map(([k,l],j)=>`<button class="btn ${tab===k?'primary':''}" style="text-align:center;min-height:44px;padding:8px 2px;font-size:14px" onclick="go({name:'mod',id:'${m.id}',tab:'${k}',i:-1})">${parts(m.id)[j]?'✓ ':''}${l}</button>`).join("")}</div>
  ${body}`;
}
function learn(m,st){
  const i=view.i, total=m.cards.length;
  if(i===-1){
    const pre=(m.prereqs||[]).map(byId).filter(Boolean);
    return `<div class="card"><span class="pill">Why an FDE needs this</span><p>${m.why}</p>
    ${m.objectives?`<h3 style="margin-top:12px">By the end you can</h3><ul>${m.objectives.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`:""}
    ${pre.length?`<p class="mute">Best after: ${pre.map(p=>`<a href="#" onclick="openMod('${p.id}');return false">${esc(p.title)}</a>`).join(", ")}</p>`:""}
    ${m.time?`<p class="mute">${esc(m.time)}</p>`:""}</div>
    <button class="btn primary" onclick="view.i=0;render()">Start (${total} cards)</button>`;
  }
  if(i<total){
    const c=m.cards[i]; S.cards[m.id]=Math.max(S.cards[m.id]||0,i+1); save();
    if(c.check && (!view.cq || view.cq.idx!==i)) view.cq={idx:i, st:qInit(c.check)};
    const chk = c.check ? `<div class="card" style="background:var(--soft)"><span class="pill">Quick check</span>${qHTML(c.check, view.cq.st, "cpick")}</div>` : "";
    const canNext = !c.check || view.cq.st.answered;
    return `<div class="mute">Card ${i+1} of ${total}</div><div class="bar"><i style="width:${(i+1)/total*100}%"></i></div>
    <div class="card" id="swipe"><h2>${c.h}</h2>${c.b.startsWith("<")?c.b:`<p>${c.b}</p>`}${code(c.code)}${c.ex?`<div class="why"><b>Example:</b> ${c.ex}</div>`:""}</div>
    ${chk}
    <div class="row"><button class="btn ghost" onclick="view.i=${i-1};render()">← Back</button><button class="btn ${canNext?'primary':'ghost'}" ${canNext?'':'disabled'} onclick="view.i=${i+1};render();scrollTo(0,0)">${canNext?'Next →':'Answer to continue'}</button></div>`;
  }
  st.learn=true; save();
  return `${(m.tryit?[].concat(m.tryit):[]).map(t=>`<div class="card"><span class="pill">Try it</span><p>${t}</p></div>`).join("")}
  ${m.summary?`<div class="card"><span class="pill">Key takeaways</span><ul>${m.summary.map(s=>`<li>${s}</li>`).join("")}</ul></div>`:""}
  ${m.further?`<div class="card"><span class="pill">Go deeper (free)</span><ul>${m.further.map(f=>`<li>${f}</li>`).join("")}</ul></div>`:""}
  <button class="btn primary" onclick="go({name:'mod',id:'${m.id}',tab:'quiz'})">Test yourself →</button>
  <button class="btn ghost" onclick="view.i=0;render()">Read the cards again</button>`;
}
function cpick(oi){ const m=byId(view.id), c=m.cards[view.i]; qPick(c.check, view.cq.st, oi); render(); }

function quiz(m,st){
  if(!view.q){ view.q={order:shuffle(m.quiz.map((_,k)=>k)),k:0,right:0,qs:null}; }
  const Q=view.q;
  if(Q.k<Q.order.length){
    const q=m.quiz[Q.order[Q.k]]; if(!Q.qs) Q.qs=qInit(q);
    return `<div class="mute">Question ${Q.k+1} of ${Q.order.length} · ${Q.right} right</div><div class="bar"><i style="width:${Q.k/Q.order.length*100}%"></i></div>
    <div class="card">${qHTML(q,Q.qs,"qpick")}${Q.qs.answered?`<button class="btn primary" style="margin-top:12px" onclick="nextQ()">Next →</button>`:""}</div>`;
  }
  const score=Q.right/Q.order.length; st.quiz=Math.max(st.quiz||0,score); save();
  return `<div class="card" style="text-align:center"><div class="big">${Q.right}/${Q.order.length}</div><p>${score>=PASS?"Passed. Nice.":`Not yet ${PASS*100}%. Missed ones are in your Review deck. Reread the cards they came from, then retake.`}</p></div>
  ${score>=PASS?`<button class="btn primary" onclick="go({name:'mod',id:'${m.id}',tab:'explain'})">Explain it in your words →</button>`:""}
  <button class="btn ghost" onclick="view.q=null;render()">Retake (new order)</button>`;
}
function qpick(oi){ const m=byId(view.id), Q=view.q, qi=Q.order[Q.k], q=m.quiz[qi];
  if(qPick(q,Q.qs,oi)){ const key=m.id+":"+qi; if(Q.qs.right){ Q.right++; S.review=S.review.filter(r=>r!==key); } else if(!S.review.includes(key)) S.review.push(key); save(); }
  render(); }
function nextQ(){ view.q.k++; view.q.qs=null; render(); scrollTo(0,0); }

function explainV(m,st){
  const list=[].concat(m.explain), k=view.ek||0, e=list[k], key=m.id+":"+k, saved=S.explain[key]||"";
  return `${list.length>1?`<div class="mute">Prompt ${k+1} of ${list.length}</div>`:""}<div class="card"><span class="pill">Say it in your own words</span><h3 style="margin-top:8px">${esc(e.q)}</h3>
  <textarea id="ex" placeholder="Type or dictate your answer…">${esc(saved)}</textarea>
  <button class="btn primary" onclick="reveal()">Compare with a model answer</button><div id="model"></div></div>
  ${list.length>1?`<div class="row">${k>0?`<button class="btn ghost" onclick="view.ek=${k-1};render()">← Prev</button>`:"<span></span>"}${k<list.length-1?`<button class="btn ghost" onclick="view.ek=${k+1};render()">Next prompt →</button>`:"<span></span>"}</div>`:""}`;
}
function reveal(){ const m=byId(view.id), list=[].concat(m.explain), k=view.ek||0, e=list[k], v=$("#ex").value.trim();
  S.explain[m.id+":"+k]=v; save();
  $("#model").innerHTML=`<div class="why"><b>One good answer:</b> ${esc(e.model)}</div>
  ${e.rubric?`<p class="mute" style="margin-top:8px">A strong answer mentions: ${e.rubric.map(esc).join(" · ")}</p>`:""}
  <p class="mute">How close were you?</p>
  <div class="row"><button class="btn" style="text-align:center" onclick="rate(1)">Got it</button><button class="btn" style="text-align:center" onclick="rate(.5)">Partly</button><button class="btn" style="text-align:center" onclick="rate(0)">Missed</button></div>
  <button class="btn" onclick="copyGrade()">💬 Copy for Claude to grade</button><textarea class="copybox" readonly id="cb" style="display:none"></textarea>`; }
function rate(x){ const st=ms(view.id); if(x>=0.5){ st.explain=true; save(); toast("Saved. On to the build."); setTimeout(()=>go({name:'mod',id:view.id,tab:'build'}),700);} else toast("Reread the cards, then try again."); }
function showCopy(t){ const b=$("#cb"); b.style.display="block"; b.value=t; copy(t); }
function copyGrade(){ const m=byId(view.id), e=[].concat(m.explain)[view.ek||0]; showCopy(`FDE study, ${m.title}. Grade my explanation like a tough but kind tutor: what's right, what's missing or wrong, then one follow-up question to test me.\n\nQuestion: ${e.q}\n\nMy answer: ${$("#ex").value.trim()}`); }

function build(m,st){
  const p=m.project, ck=S.steps[m.id]||[];
  return `<div class="card"><span class="pill">Project</span>${p.level?`<span class="pill">${esc(p.level)}</span>`:""}${p.time?`<span class="pill">${esc(p.time)}</span>`:""}<h2 style="margin-top:8px">${esc(p.title)}</h2>
  ${p.goal?`<p>${esc(p.goal)}</p>`:""}${p.builds_on?`<p class="mute">Builds on: ${esc(p.builds_on)}</p>`:""}
  <ol class="steps">${p.steps.map((s,k)=>`<li><input type="checkbox" ${ck[k]?'checked':''} onchange="step('${m.id}',${k},this.checked)"><span style="min-width:0;overflow-x:auto">${rich(s)}</span></li>`).join("")}</ol></div>
  ${p.done_when?`<div class="card"><span class="pill">Done when</span><ul>${p.done_when.map(d=>`<li>${rich(d)}</li>`).join("")}</ul></div>`:""}
  ${p.stretch?`<details class="card"><summary>Stretch goals</summary><ul>${p.stretch.map(d=>`<li>${rich(d)}</li>`).join("")}</ul></details>`:""}
  ${p.prompt?`<div class="card"><span class="pill">Role-play prompt</span><p class="mute">Paste this into a new chat with Claude to start.</p><button class="btn" style="text-align:center" onclick="copyRole('${m.id}')">Copy role-play prompt</button></div>`:""}
  <div class="card"><span class="pill">LinkedIn angle</span><p>${esc(p.share)}</p><p class="mute">Ask Claude to draft it in your voice once the project is real. Post only what you actually built and measured. Use fake data and say so.</p></div>
  <button class="btn" onclick="copyStart('${m.id}')">💬 Copy a prompt to start this with Claude</button>
  <textarea class="copybox" readonly id="cb" style="display:none"></textarea>
  <button class="btn ${st.build?'ok':'primary'}" onclick="markBuild('${m.id}')">${st.build?'✓ Project done':'Mark project done'}</button>`;
}
function copyStart(id){ const m=byId(id), p=m.project; showCopy(`FDE study, "${m.title}" project: "${p.title}". Work in C:/Users/Steve/writing/learning/claude-fde/projects/fde-lab/ (read ../../TUTOR.md first). Coach me through it step by step; let me do the thinking, don't just build it for me.
Goal: ${plain(p.goal||"")}
Steps:
- ${p.steps.map(plain).join(NL+"- ")}${p.done_when?`
Done when:
- ${p.done_when.map(plain).join(NL+"- ")}`:""}`); }
const NL = String.fromCharCode(10);
function copyRole(id){ showCopy(plain(byId(id).project.prompt)); }
function step(id,k,v){ S.steps[id]=S.steps[id]||[]; S.steps[id][k]=v; save(); }
function markBuild(id){ const st=ms(id); st.build=!st.build; save(); render(); if(st.build&&done(id)) toast("Module complete 🎉"); }

// ---------- review ----------
function review(){
  S.review=S.review.filter(k=>{const [mid,qi]=k.split(":"); return byId(mid)&&byId(mid).quiz[+qi];});
  if(!S.review.length) return `<h1>Review</h1><div class="card">Nothing to review. Questions you miss land here, and leave once you get them right.</div>`;
  if(!view.r){ view.r={list:shuffle(S.review),k:0,qs:null}; }
  const R=view.r;
  if(R.k>=R.list.length) return `<h1>Review</h1><div class="card" style="text-align:center"><p>Round done. ${S.review.length} still to master.</p></div><button class="btn primary" onclick="view.r=null;render()">Another round</button>`;
  const [mid,qi]=R.list[R.k].split(":"), m=byId(mid), q=m.quiz[+qi]; if(!R.qs) R.qs=qInit(q);
  return `<h1>Review</h1><div class="mute">${R.k+1} of ${R.list.length} · from ${esc(m.title)}</div>
  <div class="card">${qHTML(q,R.qs,"rpick")}${R.qs.answered?`<button class="btn primary" style="margin-top:12px" onclick="view.r.k++;view.r.qs=null;render()">Next →</button>`:""}</div>`;
}
function rpick(oi){ const R=view.r, key=R.list[R.k], [mid,qi]=key.split(":"), q=byId(mid).quiz[+qi]; if(qPick(q,R.qs,oi)&&R.qs.right) { S.review=S.review.filter(r=>r!==key); save(); } render(); }

// ---------- glossary flashcards ----------
function gloss(){
  const all=[]; M.forEach(m=>(m.terms||[]).forEach(t=>all.push({...t,m:m.title})));
  if(!all.length) return `<h1>Terms</h1><div class="card">No terms yet.</div>`;
  if(view.list) return `<h1>Terms</h1><button class="btn ghost" onclick="view.list=0;render()">Flashcards</button>${all.map(t=>`<div class="card"><b>${esc(t.t)}</b><div>${esc(t.d)}</div><div class="mute">${esc(t.m)}</div></div>`).join("")}`;
  if(!view.g) view.g={order:shuffle(all.map((_,k)=>k)),k:0,flip:false};
  const G=view.g, t=all[G.order[G.k%all.length]];
  return `<h1>Terms</h1><div class="mute">${all.length} terms · tap the card to flip</div>
  <div class="card flash" onclick="view.g.flip=!view.g.flip;render()">${G.flip?`<div>${esc(t.d)}</div><div class="mute" style="margin-top:8px">${esc(t.m)}</div>`:`<h2>${esc(t.t)}</h2><div class="mute">What does it mean?</div>`}</div>
  <div class="row"><button class="btn" style="text-align:center" onclick="view.g.k++;view.g.flip=false;render()">Next term →</button></div>
  <button class="btn ghost" onclick="view.list=1;render()">See all as a list</button>`;
}

// ---------- tutor ----------
const ASKS=[
  ["Quiz me out loud","Quiz me on the Claude FDE module \"____\" with 5 new questions I haven't seen, one at a time. Mix recall, a scenario and one 'what would you do as the FDE'. Wait for my answer each time, then tell me if I'm right and why."],
  ["Explain it differently","I'm studying the Claude FDE module \"____\" and this didn't click: ____. Explain it a different way, with an example from industrial plants, then check I got it with one question."],
  ["Role-play a customer","Play a customer at a manufacturing plant who wants to 'use Claude'. Be vague and a bit skeptical like real customers are. I'm the FDE: I'll run discovery to qualify the use case. Stay in character until I say stop, then score my discovery against: problem, users, data, measurable outcome, risks, next step."],
  ["Debug with me","Give me a small broken snippet (Claude API agent loop, MCP server, or a Claude Code hook) with one realistic bug. Let me find it. Hints only if I ask."],
  ["Mock FDE interview","Run a 25-minute mock interview for a Claude Forward Deployed Engineer role: one technical question (agent loop / tool use / MCP / evals), one system-design scenario for a customer, one discovery role-play, one behavioral. Feedback at the end, with what to study next."],
  ["Weekly check-in","Read C:/Users/Steve/writing/learning/claude-fde/progress.md and TUTOR.md. Ask me what I did this week, update progress.md, and suggest the next smallest step."]
];
function tutor(){
  return `<h1>Tutor</h1><div class="mute">Copy a prompt, paste it into chat with Claude, fill the blanks.</div>
  ${ASKS.map(([t,p],k)=>`<div class="card"><h3>${t}</h3><p class="mute">${esc(p)}</p><button class="btn" style="text-align:center" onclick="showCopy(ASKS[${k}][1])">Copy</button></div>`).join("")}
  <textarea class="copybox" readonly id="cb" style="display:none"></textarea>
  ${D.capstone?`<div class="card"><span class="pill">Capstone</span><h3 style="margin-top:8px">${esc(D.capstone.title)}</h3>${D.capstone.goal?`<p>${esc(D.capstone.goal)}</p>`:""}<ol>${D.capstone.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>${D.capstone.done_when?`<p class="mute">Done when: ${D.capstone.done_when.map(esc).join(" · ")}</p>`:""}</div>`:""}`;
}

// ---------- final exam ----------
function exam(){
  if(!view.x){
    const pool=[]; M.forEach(m=>m.quiz.forEach((q,qi)=>pool.push(m.id+":"+qi)));
    const n=Math.min(view.n||25,pool.length); view.x={list:shuffle(pool).slice(0,n),k:0,right:0,qs:null,miss:{}};
  }
  const X=view.x;
  if(X.k>=X.list.length){
    const pct=Math.round(X.right/X.list.length*100), weak=Object.entries(X.miss).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id,c])=>`${byId(id).title} (${c} missed)`);
    S.exams=(S.exams||[]).concat({d:new Date().toISOString().slice(0,10),pct,n:X.list.length}); save();
    return `<h1>Mixed exam</h1><div class="card" style="text-align:center"><div class="big">${pct}%</div><p>${X.right}/${X.list.length} right</p></div>
    ${weak.length?`<div class="card"><h3>Revisit</h3><ul>${weak.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`:""}
    <button class="btn primary" onclick="view.x=null;render()">New exam</button>`;
  }
  const [mid,qi]=X.list[X.k].split(":"), q=byId(mid).quiz[+qi]; if(!X.qs) X.qs=qInit(q);
  return `<h1>Mixed exam</h1><div class="mute">${X.k+1} of ${X.list.length} · ${X.right} right · from ${esc(byId(mid).title)}</div><div class="bar"><i style="width:${X.k/X.list.length*100}%"></i></div>
  <div class="card">${qHTML(q,X.qs,"xpick")}${X.qs.answered?`<button class="btn primary" style="margin-top:12px" onclick="view.x.k++;view.x.qs=null;render();scrollTo(0,0)">Next →</button>`:""}</div>`;
}
function xpick(oi){ const X=view.x, [mid,qi]=X.list[X.k].split(":"), q=byId(mid).quiz[+qi]; if(qPick(q,X.qs,oi)){ if(X.qs.right) X.right++; else { X.miss[mid]=(X.miss[mid]||0)+1; const key=mid+":"+qi; if(!S.review.includes(key)) S.review.push(key); save(); } } render(); }

// ---------- progress ----------
function me(){
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  const totalQ=M.reduce((a,m)=>a+m.quiz.length,0);
  return `<h1>Progress</h1>
  <div class="card"><h3>Mixed exam</h3><p class="mute">Random questions from every module (${totalQ} in the bank). Good for checking what stuck.</p>
  <div class="row"><button class="btn" style="text-align:center" onclick="go({name:'exam',n:15})">15 Qs</button><button class="btn primary" onclick="go({name:'exam',n:30})">30 Qs</button></div>
  ${(S.exams||[]).length?`<p class="mute">Past: ${S.exams.slice(-5).map(e=>`${e.d} ${e.pct}%`).join(" · ")}</p>`:""}</div>
  ${M.map(m=>{const st=ms(m.id);return `<div class="card mod"><div class="num ${done(m.id)?'done':''}">${esc(m.code||m.n)}</div><div style="flex:1"><b>${esc(m.title)}</b><div class="mute">Quiz best: ${st.quiz===null?'–':Math.round(st.quiz*100)+'%'} · ${st.build?'project done':'project open'}</div></div></div>`}).join("")}
  <div class="card"><h3>Save or move your progress</h3><p class="mute">Progress lives in this browser. Copy this code into chat ("save my FDE progress: …") and Claude will log it in the repo. Paste a code here to restore.</p>
  <textarea class="copybox" id="pc">${code}</textarea>
  <div class="row"><button class="btn" style="text-align:center" onclick="copy($('#pc').value)">Copy code</button><button class="btn" style="text-align:center" onclick="restore()">Restore</button></div>
  <button class="btn ghost" onclick="if(confirm('Erase all progress?')){S=blank();save();render();}">Reset everything</button></div>`;
}
function restore(){ try{ S=Object.assign(blank(),JSON.parse(decodeURIComponent(escape(atob($("#pc").value.trim()))))); save(); toast("Restored"); render(); }catch(e){ toast("That code didn't work"); } }

// swipe between learn cards (only when no unanswered check)
let sx=null; document.addEventListener("touchstart",e=>{ if(e.target.closest("#swipe")) sx=e.touches[0].clientX; },{passive:true});
document.addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)<60||view.name!=="mod"||view.tab!=="learn") return;
  const m=byId(view.id), c=m.cards[view.i]; if(dx<0){ if(c&&c.check&&!(view.cq&&view.cq.st.answered)) { toast("Answer the quick check first"); return; } view.i++; } else if(view.i>0) view.i--; render(); });

render();
</script>
</body>
</html>
