<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FDE Study</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e1d8;--acc:#c4572e;--acc2:#2e6fc4;--ok:#2f8a4e;--bad:#c23b3b;--soft:#f1ede4;--code:#f3f0e8}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--card:#211f1c;--ink:#efece4;--mute:#a19e95;--line:#34322d;--acc:#e07a4f;--acc2:#6fa0e6;--ok:#58b979;--bad:#e06464;--soft:#2a2824;--code:#191816}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:24px;margin:8px 0 4px;line-height:1.25}h2{font-size:20px;margin:0 0 8px;line-height:1.3}h3{font-size:17px;margin:0 0 6px}
p{margin:.5em 0}ul,ol{padding-left:22px;margin:.4em 0}li{margin:.25em 0}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:12px 16px;margin:8px 0;text-align:left}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;text-align:center;font-weight:600}
.btn.ghost{background:transparent;text-align:center}
.btn.sel{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 14%,var(--card))}
.btn.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.btn.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.btn.miss{border-style:dashed;border-color:var(--ok)}
.row{display:flex;gap:8px}.row>*{flex:1}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc);border-radius:8px}
.mod{display:flex;align-items:center;gap:12px}
.num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);font-weight:700;font-size:15px}
.num.done{background:var(--ok);color:#fff}
.dots{display:flex;gap:4px;margin-top:4px}.dots b{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots b.on{background:var(--ok)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;border:0;background:none;padding:9px 0 11px;font-size:11px;color:var(--mute)}
.tabs button.on{color:var(--acc);font-weight:700}
.tabs button span{display:block;font-size:20px}
.back{border:0;background:none;font-size:15px;color:var(--acc2);padding:8px 0}
.pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--mute);margin:2px 4px 2px 0}
.pill.lvl2{background:color-mix(in srgb,var(--acc2) 18%,var(--soft));color:var(--acc2)}
code{overflow-wrap:anywhere;background:var(--code);padding:1px 5px;border-radius:5px;font-size:14px;font-family:ui-monospace,Menlo,Consolas,monospace}
pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:13px;line-height:1.45;margin:10px 0;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre}
textarea{width:100%;min-height:130px;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.why{border-left:4px solid var(--acc2);padding:8px 12px;background:var(--soft);border-radius:8px;margin-top:10px}
.copybox{width:100%;min-height:90px;font-size:13px}
.big{font-size:40px;font-weight:800;line-height:1}
ol.steps{padding-left:0;list-style:none;margin:0}
ol.steps li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);margin:0}
ol.steps input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:var(--ok)}
.track{margin:22px 0 4px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.ordpick{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.ordpick .chip{border:1px solid var(--acc2);color:var(--acc2);background:var(--card);border-radius:99px;padding:4px 10px;font-size:14px}
.flash{min-height:220px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:9;max-width:90vw}
details summary{cursor:pointer;color:var(--acc2);padding:6px 0}
</style>
</head>

<script>
// VERIFY: Console prompt improver / evaluate pages now redirect to the best-practices guide and Workbench is retired (checked 2026-11-20); treat those tools as historical until the Console shows them.
window.FDE_MODS = window.FDE_MODS || [];
window.FDE_MODS.push({
  id: "b1",
  code: "B1",
  track: "2 · Building on Claude",
  title: "Prompt engineering and structured outputs",
  course: null,
  mins: 140,
  why: "Most customer prototypes are prompt plus schema plus a little code. The prompt decides quality; the schema decides whether the next system can use the output at all. FDEs are judged on turning messy field text into reliable data, fast and repeatably.",
  objectives: [
    "Write clear, direct prompts that give context, a role and a defined output",
    "Structure prompts with XML tags, documents first and the question last",
    "Use few-shot examples without teaching Claude the wrong pattern",
    "Cut hallucination with an explicit \"I don't know\" out and quote-based grounding",
    "Get guaranteed-valid JSON with output_config.format or strict tool use, and know the limits",
    "Version prompts as files so every change is traceable and testable"
  ],
  prereqs: ["p1"],
  cards: [
    {
      h: "Be clear and direct",
      b: "Anthropic's framing: treat Claude like a <b>brilliant new employee</b> who knows nothing about your site. Say exactly what you want, in what format, with what constraints. Use numbered steps when order matters. <b>The colleague test:</b> hand your prompt to someone with no context. If they'd be confused, Claude will be too. Vague asks get average answers.",
      ex: "Weak: \"Summarise these notes.\" Strong: \"List each piece of equipment that needs work, one line each: tag, the problem, and who reported it.\"",
      check: { q: "Your extractor misses half the work orders in a Northfield shift note. The prompt says \"Pull out the important stuff.\" First fix?", o: ["Switch to the most expensive model", "Say exactly what counts as a work order and what fields to return", "Add \"be accurate\" in capitals", "Shorten the note"], a: 1, why: "\"Important stuff\" fails the colleague test. Define the target and the output before reaching for a bigger model or shouting." }
    },
    {
      h: "Give context and motivation",
      b: "Explain <b>why</b> a rule exists, not just the rule. Claude generalises from the reason. \"NEVER use abbreviations\" is brittle. \"Planners outside Unit 300 read these, so expand unit-specific abbreviations\" lets Claude handle cases you never listed. Also say who the audience is and what the output feeds.",
      ex: "\"The output loads straight into the CMMS work-request import, so every field must be filled or explicitly null.\""
    },
    {
      h: "System prompts and roles",
      b: "The <code>system</code> parameter holds standing instructions: role, audience, rules, output format. The <code>user</code> turn holds this request's data. A one-sentence role already shifts tone and focus: \"You are a maintenance planner at a refinery hydrotreater unit.\" Keep the stable parts in the system prompt. It also makes prompt caching work, because the stable prefix stays identical between calls.",
      code: `SYSTEM = """You are a maintenance planner for Northfield Chemicals Unit 300,
a hydrotreater preparing for turnaround. You turn shift notes into
work orders for the CMMS. Planners act on these orders, so never
invent a tag, a name or a priority the note doesn't support."""`,
      ex: "System prompt = the standing procedure. User turn = today's job card."
    },
    {
      h: "Structure with XML tags",
      b: "When a prompt mixes instructions, context, examples and input, wrap each in its own tag: <code>&lt;instructions&gt;</code>, <code>&lt;priority_rules&gt;</code>, <code>&lt;shift_note&gt;</code>. Claude then can't mistake the data for instructions. Use consistent, descriptive names and nest them where there's a hierarchy. There are no magic tag names; clarity is the point. Tags also make output easy to parse if you ask Claude to answer inside one.",
      code: `<priority_rules>
P1: safety or environmental risk, or a unit trip risk. Same shift.
P2: degrading equipment, no immediate risk. This week.
P3: housekeeping or minor. Next window.
</priority_rules>
<shift_note id="{{NOTE_ID}}">
{{NOTE_TEXT}}
</shift_note>`,
      ex: "Like line numbering on a P&ID: the content was always there; the labels stop people mixing it up."
    },
    {
      h: "Few-shot examples, and their pitfalls",
      b: "Examples are one of the most reliable ways to steer format and judgement. Anthropic suggests <b>3–5</b>, wrapped in <code>&lt;example&gt;</code> tags inside <code>&lt;examples&gt;</code>. Make them <b>relevant</b> (real-looking notes) and <b>diverse</b> (a safety case, a no-work-order case, two orders in one note). <b>Pitfalls:</b> Claude copies quirks. If every example has exactly one order, it will under-extract multi-order notes. If every example is P2, priorities drift to P2. Never reuse your test cases as examples: that hides failures.",
      ex: "Include one example where the right answer is \"no work orders\", or Claude learns that every note must produce one.",
      check: { q: "All four of your examples show one work order per note, each P2. What's the likely side effect?", o: ["None; examples only affect formatting", "Claude refuses notes with no orders", "Claude under-extracts multi-order notes and leans toward P2", "Claude stops using the schema"], a: 2, why: "Claude picks up unintended patterns from examples. Vary count, priority and edge cases so the only common thread is the behaviour you want." }
    },
    {
      h: "Let Claude think before answering",
      b: "Hard judgements improve when Claude reasons first. On current models, thinking is <b>adaptive</b> and steered by <b>effort</b>: raise effort for tricky priority calls, lower it for plain lookups. Don't ask the model to write its step-by-step reasoning into the output; on several current models that can be declined. If you want an audit trail, ask for a <b>short explanation</b> or the supporting quote as a field instead.",
      ex: "Add a field \"evidence\": the exact phrase from the note that justifies the priority. Planners can check it in two seconds."
    },
    {
      h: "An \"I don't know\" out, and grounding",
      b: "Claude is built to be helpful, so with no way out it may guess. <b>Explicitly allow uncertainty</b>: \"If the note doesn't say who reported it, use null. Never guess a name.\" For longer documents, ask Claude to <b>pull exact quotes first</b>, then answer only from those quotes. You can also have Claude find a supporting quote for each claim and retract any claim it can't support. This cuts hallucination a lot, but it doesn't eliminate it, so check high-stakes fields.",
      ex: "\"requested_by: null\" is a correct answer. \"requested_by: J. Smith\" invented from nowhere is a dangerous one.",
      check: { q: "A shift note says \"seal weeping on the charge pump again\" with no name. Your extractor fills requested_by with \"Operator\". Best prompt fix?", o: ["Tell Claude requested_by must be null unless a person is named in the note", "Remove requested_by from the schema", "Add more examples with names in them", "Raise effort to max"], a: 0, why: "Give Claude a sanctioned 'unknown' answer and make it the rule. More named examples would push it further toward inventing names." }
    },
    {
      h: "Long documents: data first, question last",
      b: "With long inputs (procedures, a week of logs), put the documents <b>at the top</b>, then instructions and examples, then the question <b>last</b>. Anthropic reports this improves results across models. Wrap each document in <code>&lt;document&gt;</code> with <code>&lt;source&gt;</code> and <code>&lt;document_content&gt;</code> subtags so Claude can cite which one it used. For a batch of shift notes, give each note an id so outputs map back to inputs.",
      ex: "Ten shift notes at the top, each tagged with an id, then: \"Extract work orders from every note above. Include note_id on each.\""
    },
    {
      h: "Prompt chaining",
      b: "Split a big job into steps, each its own API call, when you need to inspect or control what happens between them. The common pattern is <b>self-correction</b>: draft, then review against criteria, then refine. For Northfield: call 1 extracts orders; call 2 checks each order against the note (\"is every field supported by the text?\"); your code merges the corrections. Each step can be logged, tested and swapped independently.",
      ex: "Like a two-person check on an isolation: one person does it, a second verifies against the list."
    },
    {
      h: "Templates, variables and versions",
      b: "Treat prompts as <b>code</b>. Keep the fixed text in a file with <code>{{VARIABLES}}</code> for the parts that change (the note, the date). Save each version as a new file: <code>prompts/extract_v1.txt</code>, <code>v2</code>… Commit them to git with a one-line changelog: what changed and why. Record which version produced each output. Without that, you can't say whether yesterday's fix helped, or roll back when it didn't. B2 builds the tests that answer that.",
      ex: "v3: \"Added rule: requested_by null unless named. Reason: v2 invented 'Operator' on 3 of 10 notes.\""
    },
    {
      h: "Structured outputs: guaranteed JSON",
      b: "Set <code>output_config.format</code> to <code>{\"type\": \"json_schema\", \"schema\": ...}</code> and Claude's text output is constrained to match your schema. Every object needs <code>\"additionalProperties\": false</code> and a <code>required</code> list. For tool inputs, add <code>\"strict\": true</code> to a tool instead. In Python, <code>client.messages.parse(..., output_format=MyPydanticModel)</code> returns <code>parsed_output</code>. <b>Limits:</b> no recursive schemas; no <code>minimum</code>/<code>maximum</code> or <code>minLength</code>; still check for <code>refusal</code> and <code>max_tokens</code>; enum casing isn't guaranteed. Valid JSON is not correct JSON.",
      code: `WO = {"type": "object", "additionalProperties": False,
      "required": ["note_id", "tag", "issue", "priority",
                   "requested_by", "safety_flag"],
      "properties": {
        "note_id": {"type": "string"}, "tag": {"type": "string"},
        "issue": {"type": "string"},
        "priority": {"type": "string", "enum": ["P1", "P2", "P3"]},
        "requested_by": {"type": ["string", "null"]},
        "safety_flag": {"type": "boolean"}}}
SCHEMA = {"type": "object", "additionalProperties": False,
          "required": ["work_orders"],
          "properties": {"work_orders": {"type": "array", "items": WO}}}
r = client.messages.create(model="claude-haiku-5-5", max_tokens=4096,
      system=SYSTEM, messages=[{"role": "user", "content": prompt}],
      output_config={"format": {"type": "json_schema", "schema": SCHEMA}})
text = next(b.text for b in r.content if b.type == "text")
orders = json.loads(text)["work_orders"]`,
      check: { q: "Your schema includes {\"type\": \"integer\", \"minimum\": 1} for a quantity field. What happens?", o: ["Works fine; minimum is enforced", "Claude ignores the minimum silently", "The response is always null", "The API returns a 400 error: numerical constraints aren't supported"], a: 3, why: "Numerical and string-length constraints aren't supported in structured-output schemas. Validate those in your own code, or let the SDK helper move them into descriptions." }
    },
    {
      h: "Extraction pipelines and iterating",
      b: "A real pipeline: <b>1.</b> clean and id each input. <b>2.</b> Extract with a versioned prompt and a schema. <b>3.</b> Validate in code (known tags from equipment.json, enum casing, dates). <b>4.</b> Flag low-confidence or failed records for a human. <b>5.</b> Log input, prompt version, output, tokens. Iterate in the Console playground (which replaced the old Workbench) or a script, change one thing at a time, and save each version. Prefilling Claude's reply is no longer supported on current models; use instructions, tags or structured outputs instead.",
      ex: "Claude returns tag \"P301A\"; your validator normalises it to P-301A, or flags it if no such tag exists in equipment.json."
    }
  ],
  tryit: [
    "In claude.ai, paste this note: \"0300 - E-305 shell side leak small drip, told Raj. Also PSV on V-302 tag missing lol.\" Ask for work orders with no instructions. Then ask again with the priority rules from card 4 and \"requested_by is null unless a person is named\". Compare.",
    "Take one weak prompt you've used at work and rewrite it with a role, the reason, XML-tagged input and a defined output. Run both on the same input and note what changed."
  ],
  summary: [
    "Clear, specific prompts with the reason behind each rule beat clever wording.",
    "Role and standing rules go in <code>system</code>; this request's data goes in the user turn, tagged.",
    "3–5 diverse examples steer well; uniform examples teach the wrong pattern, and test cases never belong in them.",
    "Give Claude a sanctioned \"unknown\" (null, \"I don't know\") and ground answers in quotes.",
    "Long inputs first, question last; ids on every input so outputs map back.",
    "<code>output_config.format</code> or <code>strict</code> tools guarantee shape, not truth. Validate the content in code.",
    "Prompts are code: templates, versions in git, a changelog, and the version recorded on every output."
  ],
  further: [
    "<a href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices\">Prompting best practices</a> — Anthropic's current reference for all techniques here",
    "<a href=\"https://platform.claude.com/docs/en/build-with-claude/structured-outputs\">Structured outputs</a> — schema rules, limitations and the Pydantic parse helper",
    "<a href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations\">Reduce hallucinations</a> — \"I don't know\", quotes and citation checks",
    "<a href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use\">Strict tool use</a> — schema-guaranteed tool inputs",
    "<a href=\"https://github.com/anthropics/prompt-eng-interactive-tutorial\">Anthropic prompt engineering interactive tutorial</a> — free hands-on exercises"
  ],
  quiz: [
    { q: "You're on site. The planner says the extractor \"keeps making up who reported things.\" Which change goes most directly at the cause?", o: ["Add five more examples", "Tell Claude requested_by is null unless a person is named, and why", "Switch to Opus", "Ask Claude to be careful"], a: 1, why: "Hallucinated names come from having no permitted 'unknown'. Give the null out and the reason; bigger models and pleas don't remove the pressure to fill the field." },
    { q: "Where should ten long shift notes go relative to your instructions and question?", o: ["After the question, so Claude reads the task first", "Split between system and user turns", "In the middle, between rules and examples", "At the top, with the question last"], a: 3, why: "Long data first, query last improves results. Putting notes after the question is the common mistake." },
    { q: "Which statement about structured outputs is true?", o: ["They guarantee the extracted priority is correct", "They guarantee valid JSON matching your schema in most cases, but not correct content", "They work with recursive schemas", "They remove the need to check stop_reason"], a: 1, why: "Shape is guaranteed (with refusal and max_tokens as exceptions); truth isn't. That's why B2 exists." },
    { t: "multi", q: "Select ALL schema features that structured outputs reject or don't support.", o: ["Recursive schemas", "minimum / maximum on numbers", "enum on a string", "additionalProperties set to true", "required arrays"], a: [0, 1, 3], why: "Recursion, numerical constraints and additionalProperties other than false are unsupported. enum and required are fine; enum casing isn't guaranteed, so compare case-insensitively." },
    { q: "Spot the problem with this schema for structured outputs.", code: `{"type": "object",
 "properties": {"tag": {"type": "string"},
                "priority": {"type": "string",
                             "enum": ["P1", "P2", "P3"]}},
 "required": ["tag", "priority"]}`, o: ["enum isn't allowed", "required must be empty", "additionalProperties: false is missing", "tag must be an integer"], a: 2, why: "Objects need additionalProperties set to false. Everything else here is valid." },
    { q: "Your four few-shot examples are four of the twenty golden-set cases you'll test on. What's wrong?", o: ["Nothing; real cases are the best examples", "Too few examples", "Examples must be in the system prompt", "Your scores on those four are inflated, so the test overstates quality"], a: 3, why: "Examples that are also test cases leak the answers. Keep examples and test cases separate, or the eval lies to you." },
    { q: "A prompt says: \"Write your step-by-step reasoning in <thinking> tags, then the answer.\" On Opus 5.5, what's the better approach?", o: ["Keep it; tags are always best", "Rely on adaptive thinking (adjust effort) and ask for a short explanation or evidence field instead", "Ask for reasoning in the JSON output", "Turn thinking off with budget_tokens 0"], a: 1, why: "On several current models, prompts that ask for written-out reasoning can be declined. Thinking is built in; steer it with effort and ask for short evidence if you need an audit trail." },
    { q: "A colleague tries to force JSON by prefilling the assistant turn with \"{\". On current models this…", o: ["Returns a 400 error; prefill on the last assistant turn isn't supported. Use structured outputs", "Works and is the recommended way", "Works only with Haiku", "Returns YAML"], a: 0, why: "Prefilled final assistant turns stopped being supported from the 4.6 generation. Structured outputs, tags or instructions replace it." },
    { t: "order", q: "Put a self-correcting extraction chain in order.", o: ["Code validates tags against equipment.json", "Call 2 checks each order against the note", "Call 1 extracts work orders", "Flag failures for a human", "Merge the corrections"], a: [2, 1, 4, 0, 3], why: "Draft, review, refine, then deterministic checks, then a human for what's left. Each step can be logged and tested." },
    { q: "Why explain the reason behind a rule (\"planners outside Unit 300 read these\") rather than just state it?", o: ["It's more polite", "Claude generalises from the reason to cases you didn't list", "It reduces token cost", "Claude ignores rules without reasons"], a: 1, why: "Motivation lets Claude apply the intent to new situations. Bare rules handle only what you anticipated." },
    { q: "You changed three things in the prompt at once and accuracy dropped. What should you have done?", o: ["Changed one thing per version and logged each with a reason", "Used a bigger model", "Added more examples", "Dropped the schema"], a: 0, why: "One change per version, recorded, is the only way to know which change did what. It's MOC for prompts." },
    { q: "A note says \"P-301 A/B both vibrating, swap to B tonight, A to shop\". Your schema has one tag per work order. Best handling?", o: ["Put \"P-301 A/B\" in one tag field", "Drop the second pump", "Tell Claude to create one work order per tag, and include this pattern in an example", "Add a recursive schema"], a: 2, why: "One order per piece of equipment keeps the CMMS clean. Teach the split explicitly, with an example, so it isn't left to chance.", lvl: 2 },
    { q: "Your extractor returns priority \"p1\" once in 200 calls, though your enum is [\"P1\",\"P2\",\"P3\"]. What's the robust fix?", o: ["Report a bug; enums are guaranteed exactly", "Normalise case in your validator before comparing", "Remove the enum", "Retry until it's uppercase"], a: 1, why: "Structured outputs don't guarantee enum capitalisation. Compare case-insensitively and normalise in code.", lvl: 2 }
  ],
  explain: [
    { q: "Explain to Northfield's maintenance manager why structured outputs alone don't make the extractor trustworthy.", model: "The schema guarantees the answer comes back in the right boxes: every work order has a tag, a priority and so on. It doesn't guarantee what's in the boxes is right. The tag could be the wrong pump, or the priority could be too low. So we still check tags against the equipment list, test on known notes, and have a planner review anything flagged.", rubric: ["Shape vs truth distinction", "A concrete example of a wrong-but-valid field", "Names a check: validation, tests or human review", "No jargon"] },
    { q: "Why version prompts as files, and what goes in each version's note?", model: "Because a prompt change can make things better or worse, and without versions you can't tell which or undo it. Each version is a file in git with a one-line note: what changed, why, and ideally the test score before and after. Every output records the version that made it.", rubric: ["Traceability and rollback", "What changed and why", "Links to measured results", "Output records the prompt version"] }
  ],
  project: {
    title: "Northfield work-order extractor",
    level: "Core",
    time: "~2.5 h",
    goal: "Turn 10 messy, fake Northfield shift notes into work orders (tag, issue, priority, requested_by, safety_flag) that match a JSON schema, with every prompt version saved.",
    builds_on: "P1 (API calls in Python), F1-F3 (equipment.json for valid tags)",
    steps: [
      "In fde-lab, create notes/shift_notes.jsonl: 10 fake notes with ids N01-N10. Make them messy: abbreviations, two orders in one note, a note with no work, a vague safety hint, a misspelled tag, one with no reporter named.",
      "Write the schema from card 11 in schema.py (add note_id). Keep it flat.",
      "Write prompts/extract_v1.txt: role, task, priority rules in tags, {{NOTE_ID}} and {{NOTE_TEXT}} variables. No examples yet.",
      "Write extract.py: fill the template, call with output_config.format, parse, and save results/v1.jsonl tagged with the prompt version.",

  id: "d2", code: "D2", track: "6 · Delivery",
  title: "Driving enterprise adoption", course: "Driving enterprise adoption of Claude",
  mins: 80,
  why: "Buying licenses is not transformation. An FDE helps leaders through the messy middle, where usage dips before it climbs, and sets up the people and habits that make the gains last. Plant rollouts of new CMMS or permit systems taught most of these lessons the hard way.",
  objectives: [

  prereqs: ["d1"],
  cards: [
    { h: "Three phases of adoption",
      b: "<ul><li><b>Activation</b>: technical foundations and organizational readiness. Success team, provisioning, culture for change, enablement, launch.</li><li><b>Acceleration</b>: scale through structured governance, a <b>Center of Excellence</b> (CoE) and continuous train-the-trainer.</li><li><b>Expansion</b>: use the wins to measure impact, celebrate, iterate, then move to new products and use cases.</li></ul>The phases overlap, but skipping one is how adoption stalls.",
      ex: "Northfield: Activation is the first six weeks on Unit 300. Acceleration spreads to maintenance and operations. Expansion reaches Units 400 and 500.",
      check: { q: "Setting up a Center of Excellence and continuous train-the-trainer belongs to which phase?", o: ["Activation", "Acceleration", "Expansion", "Pre-sales"], a: 1, why: "Acceleration scales impact through governance, a CoE and trainers. Activation is setup and launch; Expansion is new use cases." } },
    { h: "Activation in detail",
      b: "Five parts: <b>success team</b> (sponsor, project lead, IT, a champion, an FDE), <b>provisioning</b> (accounts, SSO, access, approved data and tools), <b>culture for change</b> (why we are doing this, what it is not), <b>enabling</b> (training that uses the person's own work) and <b>launch</b> (a dated event with an executive voice).<br>Technical readiness without organizational readiness gives you working licenses nobody uses.",
      ex: "Plant version: you do not hand out a new permit system on a Monday with an email. You train the permit coordinators first, then go live by unit." },
    { h: "The productivity J-curve",
      b: "When people learn a new way of working, output often <b>dips</b> before it rises. They spend time on prompts, checking results, and rethinking steps. The curve is expected, and its depth and length depend on how well you enable people.<br>Manage leadership through it: tell them early, agree what leading indicators to watch (weekly active use, tasks tried, quality of outputs, champion count), and never judge at the bottom.",
      ex: "Week 3 of the new CMMS: work orders took longer to close. By week 8 they were faster than before. Cancelling in week 3 would have thrown that away.",
      check: { q: "Six weeks in, output has dipped and an executive wants to cancel. Best response?", o: ["Agree and cancel", "Explain the expected J-curve and show leading indicators of learning", "Hide the numbers", "Buy more licenses"], a: 1, why: "The dip is expected. Show leading indicators and a timeline for the climb, agreed before launch." } },
    { h: "Psychological safety",
      b: "People will only experiment if it is safe to be wrong in public. If a poor result gets someone mocked, they stop trying, or they use Claude secretly and never share. Make it safe:<ul><li>Leaders share their own failed attempts first.</li><li>Ask 'what did you try?' not 'why did it fail?'</li><li>Have a no-blame place for bad outputs and near misses.</li><li>Be honest about what it means for jobs; do not promise what you cannot guarantee.</li></ul>This is the same as a good near-miss reporting culture.",
      ex: "A plant with a blame culture gets few near-miss reports. A plant that thanks reporters gets many. Same pattern for AI experiments." },
    { h: "Three core principles",
      b: "<ol><li><b>Leader-led rationale</b>: leaders explain why the organization is adopting, in their own words, repeatedly. Not an IT announcement.</li><li><b>Growth mindset</b>: skill with Claude is learned. Early clumsiness is normal; effort and practice are rewarded.</li><li><b>Systematic sharing of wins</b>: a regular, visible habit, not an accident. Success spreads by example from peers.</li></ol>If one is missing, adoption tends to stay shallow.",
      check: { q: "Which is one of the three core principles?", o: ["Mandate daily usage quotas", "Leaders articulate why the organization is adopting", "Restrict use to IT only", "Share results only at year end"], a: 1, why: "The three are leader-led rationale, growth mindset and systematic sharing of wins. Quotas drive counts, not understanding." } },
    { h: "Champions and train-the-trainer",
      b: "A <b>champions program</b> picks respected practitioners across teams and shifts, gives them early access, extra training and a small amount of protected time. <b>Train-the-trainer</b> then has them teach their peers, using real tasks from that team.<br>Why it works: a champion on night shift reaches people a central team cannot, and speaks their language. Keep it continuous: new champions join as the user base grows.",
      ex: "Northfield: one champion per shift crew, one in planning, one in inspection. Each runs a 30-minute demo on their own work order.",
      check: { q: "Why does train-the-trainer matter?", o: ["It replaces documentation", "It spreads skills faster than a central team alone, in peers' own context", "It is cheaper than software", "It is required by law"], a: 1, why: "Peers multiply reach and credibility. It supplements docs, it does not replace them." } },
    { h: "Center of Excellence and governance",
      b: "A <b>CoE</b> is a small cross-functional group (often IT, security, a business lead and champions) that: sets usage guidance and safe-data rules, collects what works into a shared library, runs office hours, reviews new use cases, and reports impact to leadership.<br>Keep governance light. Heavy approval steps push people to unsanctioned tools. Think of it as the MOC process: enough review to be safe, not so much that people bypass it." },
    { h: "Communication templates",
      b: "Reuse a few formats on a schedule:<ul><li><b>Launch email</b> from the leader: why, what changes, what does not, how to get help, first step.</li><li><b>Weekly win note</b>: one real story, with the person named and the time or quality gain.</li><li><b>Office hours invite</b>: when, where, bring a real task.</li><li><b>Dip note</b>: 'we expect a learning dip; here is what we are watching.'</li></ul>A leader's own words beat a polished corporate version. Short and specific beats long and warm.",
      ex: "Subject: Why Unit 300 is starting with Claude, and what I will do first. Written by the plant manager, signed by name." },
    { h: "Measurement and surveys",
      b: "Measure in three layers: <b>usage</b> (weekly active users, depth of use), <b>behavior</b> (tasks delegated, workflows changed), <b>outcome</b> (time, quality, cost vs baseline from D1). Add a short transformation survey at launch, day 30 and day 90: confidence, time saved on a named task, blockers, whether leadership's reason is clear.<br>Treat surveys as a supporting signal; pair them with real timestamps." },
    { h: "Technical configuration checklist (concept level)",
      b: "Before launch, confirm each of these with IT:<ul><li>Identity: SSO, provisioning, role and group setup.</li><li>Access and data: which sources and tools are connected, and the safe-data rules.</li><li>Admin settings and usage visibility for the success team.</li><li>Shared team assets: CLAUDE.md, skills, approved connectors.</li><li>Support path: who answers a locked-out user on day one.</li></ul>Check current admin options in the product docs; settings change.",
      ex: "Nothing kills a launch like a cohort that cannot sign in on Monday." },
    { h: "Expansion and the plant lesson",
      b: "In Expansion you measure impact, <b>celebrate</b> publicly, iterate on what did not work, then bring in new products and use cases, each with its own D1 qualification. Celebration is not decoration; it is how the next team decides to try.<br>Plant parallel: the CMMS that stuck had champions, a leader who used it visibly, a known dip, and wins shared at the weekly meeting. The ones that failed were go-lives with a training day and no follow-up." }
  ],

window.FDE_MODS.push({
  id: "f1", code: "F1", track: "0 · Foundations", course: null,
  title: "Terminal and files",
  mins: 60,
  why: "Almost everything an FDE does with Claude happens through a terminal: Claude Code, scripts, API calls, logs. If you can read a path, a command and an error message calmly, you can supervise an AI that types commands for you and catch the one that is wrong.",
  objectives: [
    "Explain what a shell is and tell PowerShell, bash and Git Bash apart",
    "Navigate with absolute and relative paths using cd, ls, pwd and mkdir",
    "Run a program with arguments and flags, and read its exit code",
    "Explain environment variables and PATH, and set one for a session",
    "Combine commands with pipes and redirect output into a file",
    "Read an error message and decide the next step without panicking"
  ],
  prereqs: [],
  cards: [
    { h: "A shell is a text conversation with your computer",
      b: "A <b>terminal</b> is the window. A <b>shell</b> is the program inside it that reads what you type and runs it. You type a command, press Enter, the shell runs the program and prints the result. Nothing is magic: clicking a folder in Explorer and typing <code>cd folder</code> do the same job.<br>Plant analogy: the shell is the operator console, a command is a setpoint change. It does exactly what you typed, nothing more.",
      ex: "Typing <code>ls</code> in the Northfield folder is the same as opening it in Explorer and looking.",
      check: { q: "What is the relationship between a terminal and a shell?", o: ["They are the same thing under two names", "The terminal is the window; the shell is the program inside it that interprets commands", "The shell is the window; the terminal runs the commands", "The terminal only works on Linux"], a: 1, why: "The terminal is just the window (text in, text out). The shell inside it parses your commands and launches programs. You can run different shells in the same kind of terminal." } },
    { h: "PowerShell, bash and Git Bash",
      b: "Different shells speak different dialects. <b>PowerShell</b> is the Windows default. <b>bash</b> is the shell on Linux and Mac, and most tutorials, docs and AI-written commands assume it. <b>Git Bash</b> installs with Git for Windows and gives you bash on Windows.<ul><li>Same idea, different spelling: <code>ls</code> works in both, but <code>export</code>, <code>$VAR</code> and <code>&amp;&amp;</code> behave differently.</li><li>Pick one for this course: Git Bash. Commands in the lessons will work as written.</li></ul>",
      code: `# PowerShell                 # bash / Git Bash
$env:MY_VAR = "hello"        export MY_VAR=hello
echo $env:MY_VAR             echo $MY_VAR
Get-ChildItem                ls
Remove-Item notes.txt        rm notes.txt`,
      ex: "If a command from a blog fails in PowerShell with a strange syntax error, it was probably written for bash." },
    { h: "Paths: where am I, where is that file",
      b: "A <b>path</b> is the address of a file or folder. An <b>absolute</b> path starts at the top (<code>C:/Users/Steve/writing</code>, or <code>/c/Users/Steve</code> in Git Bash). A <b>relative</b> path starts from where you are now. Three shortcuts:<ul><li><code>.</code> means this folder</li><li><code>..</code> means the parent folder (one level up)</li><li><code>~</code> means your home folder</li></ul>On Windows, Git Bash prefers forward slashes. Backslashes are the escape character in bash, so <code>C:\\Users</code> breaks.",
      code: `pwd                       # print where I am
cd ~                      # go home
cd writing/learning       # relative: down two levels
cd ..                     # up one level
cd /c/Users/Steve         # absolute path in Git Bash`,
      ex: "From <code>fde-lab/data</code>, the file <code>../equipment.csv</code> is one level up.",
      check: { q: "You are in /home/steve/fde-lab/data. What does cd ../.. do?", o: ["Stays where you are", "Goes to /home/steve/fde-lab", "Goes to /home/steve", "Goes to the root /"], a: 2, why: "Each .. climbs one level: data to fde-lab, then fde-lab to /home/steve. Count the dots as steps up." } },
    { h: "The five commands that cover most of your day",
      b: "<ul><li><code>pwd</code> prints your current folder</li><li><code>ls</code> lists files (<code>ls -l</code> shows sizes and dates)</li><li><code>cd</code> changes folder</li><li><code>mkdir</code> makes a folder</li><li><code>cat</code> prints a file's contents</li></ul>Handy extras: <code>head -n 5 file</code> shows the first 5 lines, <code>wc -l file</code> counts lines, <code>cp</code> copies, <code>mv</code> moves or renames, <code>rm</code> deletes. <b>rm has no recycle bin.</b> Gone is gone, so read what you typed before pressing Enter.",
      code: `mkdir fde-lab
cd fde-lab
mkdir data
ls
cat notes.txt
head -n 3 equipment.csv`,
      ex: "Run <code>wc -l equipment.csv</code> on a 20-row file with a header and you get 21." },
    { h: "Running programs, arguments and flags",
      b: "A command is a program name followed by <b>arguments</b>. Arguments starting with a dash are <b>flags</b> (options). Short form <code>-l</code>, long form <code>--long</code>. Some flags take a value. Arguments with spaces need quotes.<ul><li><code>node --version</code> asks a program to describe itself</li><li><code>python script.py data.csv</code>: the program is python, the script and data are arguments</li><li><code>command --help</code> almost always prints usage</li></ul>This is exactly how <code>claude -p \"summarise\"</code> works later: program, flag, quoted argument.",
      code: `ls -l
ls -l data
git commit -m "Add equipment list"
python --version
claude --help`,
      ex: "Quotes matter: <code>mkdir Unit 300</code> makes two folders, <code>mkdir \"Unit 300\"</code> makes one." },
    { h: "Environment variables and PATH",
      b: "An <b>environment variable</b> is a named setting that every program started from this shell can read. Programs use them for settings and secrets, for example <code>ANTHROPIC_API_KEY</code>. Set one in bash with <code>export NAME=value</code>; read it with <code>$NAME</code>. It lasts for that terminal session only.<br><b>PATH</b> is a special variable: a list of folders the shell searches when you type a program name. If you type <code>python</code> and get 'command not found', either it is not installed or its folder is not on PATH.",
      code: `export SITE=Northfield
echo $SITE
echo $PATH
which python        # where does the shell find python?`,
      ex: "Never print a real API key into a screenshot or a shared log. Treat it like a gate key.",
      check: { q: "You install a tool, type its name, and get 'command not found'. What does that most likely mean?", o: ["Your computer is out of memory", "The shell cannot find the program in any folder on PATH", "The tool is too old to run", "You need administrator rights for every command"], a: 1, why: "The shell only looks in the folders listed in PATH. Either the tool is not installed, or its folder is not on PATH (often fixed by reopening the terminal or adding the folder)." } },
    { h: "stdout, stderr and exit codes",
      b: "Every program has two output streams. <b>stdout</b> is normal output. <b>stderr</b> is error and warning messages. Both show on screen, but they can be separated. When a program finishes it also returns an <b>exit code</b>: <code>0</code> means success, anything else means something went wrong. In bash, <code>$?</code> holds the last exit code.<br>This matters because tools and Claude Code hooks decide what to do from exit codes, not from how the text looks.",
      code: `ls data
echo $?              # 0 : worked
ls nothing-here
echo $?              # 2 : failed (code varies by tool)`,
      ex: "A hook that must block a bad action does it by exiting with a non-zero code." },
    { h: "Pipes and redirection: small tools, chained",
      b: "A <b>pipe</b> <code>|</code> sends one program's stdout into another's input. <b>Redirection</b> sends output to a file instead of the screen: <code>&gt;</code> overwrites, <code>&gt;&gt;</code> appends, <code>2&gt;</code> captures stderr. Think of it as piping between units: each tool does one job. New words here: <code>grep word file</code> prints only the lines containing that word; <code>wc -l</code> counts lines.",
      code: `cat equipment.csv | head -n 5
cat equipment.csv | grep high | wc -l
ls > listing.txt          # overwrite
echo "---" >> listing.txt # append
python run.py 2> errors.log`,
      ex: "Count the high-criticality items: <code>grep high equipment.csv | wc -l</code>.",
      check: { q: "You run  echo done > log.txt  twice. What does log.txt contain?", o: ["done, twice, on two lines", "Just one line: done", "Nothing, the second run fails", "An error about the file existing"], a: 1, why: "A single > overwrites the file each time, so only the last write remains. Use >> to append. Mixing the two up is how people lose logs." } },
    { h: "Why Claude Code asks permission before commands",
      b: "Claude Code can run shell commands as you, with your files and your logins. A wrong <code>rm</code> or a leaked key is real. So by default it asks before running commands or editing files. This is the same logic as a permit-to-work: the person with authority approves the specific job.<ul><li>Read the exact command before approving. You now know enough to.</li><li>Be suspicious of <code>rm -r</code>, <code>sudo</code>, anything piping a download into bash, and any command touching <code>.env</code>.</li><li>Allow-lists and modes (plan, acceptEdits) reduce prompts for safe, repeated commands.</li></ul>",
      ex: "Approve <code>ls</code> and <code>pytest</code> freely. Stop and read before <code>rm -rf</code> or <code>curl ... | bash</code>." },
    { h: "Reading an error message calmly",
      b: "Errors look scary and are usually specific. Read in this order:<ol><li>The <b>last line</b>: it names the problem.</li><li>The <b>file and line number</b> just above it.</li><li>The <b>words</b>: 'No such file', 'Permission denied', 'command not found', 'syntax error' each point to a short list of causes.</li></ol>Then change one thing and retry. When you paste an error to Claude, paste the whole thing plus the command you ran. That is the single best debugging prompt.",
      code: `$ cat equipmnt.csv
cat: equipmnt.csv: No such file or directory
# Typo in the name. Check with:  ls`,
      ex: "'Permission denied' on a file is a rights problem. 'No such file' is a path or spelling problem. Different fixes." }
  ],
  tryit: [
    "Open Git Bash. Run <code>pwd</code>, <code>cd ~</code>, <code>pwd</code>, then <code>cd ..</code> and <code>pwd</code> again. Say out loud, before pressing Enter, where each command will take you.",
    "Run <code>ls nothing-here</code>, then <code>echo $?</code>. Then run <code>ls</code> and <code>echo $?</code>. Write down the two exit codes and which stream the error text went to (try <code>ls nothing-here 2&gt; err.txt</code> and then <code>cat err.txt</code>)."
  ],
  summary: [

    "Program, flags, arguments: read a command left to right before approving it.",

    "stdout is output, stderr is errors, exit code 0 means success. Hooks and scripts act on exit codes.",
    "| chains tools, > overwrites, >> appends. rm has no undo.",

  further: [
    "<a href=\"https://code.claude.com/docs/en/overview\">Claude Code overview</a> — what Claude Code runs in your terminal and how to start it",
    "<a href=\"https://code.claude.com/docs/en/permissions\">Claude Code permissions</a> — how approval prompts, allow-lists and modes work",
    "<a href=\"https://git-scm.com/downloads\">Git for Windows / Git downloads</a> — installs Git Bash",
    "<a href=\"https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Environment_setup/Command_line\">MDN: the command line crash course</a> — a gentle, free walkthrough of the same ideas",
    "<a href=\"https://learn.microsoft.com/en-us/powershell/scripting/overview\">PowerShell overview (Microsoft Learn)</a> — read this if you stay in PowerShell"
  ],
  quiz: [
    { q: "You are in /home/steve/fde-lab. Which command moves you into the data folder inside it?", o: ["cd /data", "cd ../data", "cd data", "cd ~data"], a: 2, why: "A relative path with no leading slash starts from where you are. /data would look at the very top of the disk; ../data looks beside fde-lab." },
    { q: "On site, Claude Code asks to run:  rm -rf data  in your lab. What is the right response?", o: ["Approve; Claude knows what it is doing", "Always deny every command", "Switch to bypassPermissions so it stops asking", "Read the command, check the folder is the intended one and expendable, then approve or deny"], a: 3, why: "A permission prompt is your permit-to-work check. -rf deletes recursively with no recycle bin, so verify the target before approving. Blanket denial or bypassing both defeat the control." },
    { q: "A script prints a Python traceback, but you only need the exit code to decide what to do next. Where is it?", o: ["At the top of the traceback", "In the file the script writes", "In $? right after the command (0 means success)", "In stderr"], a: 2, why: "The exit code is separate from both output streams. In bash, $? holds it for the last command. Non-zero means failure." },
    { q: "Which are true about the redirect operators? Select all that apply.", o: [">> appends to a file", "> overwrites a file", "2> redirects stderr", "| writes output to a file"], a: [0, 1, 2], why: "A pipe | feeds output into another program, it does not write a file. >, >> and 2> are the file redirects." },
    { t: "order", q: "Put these steps in the order you would take to debug a failing command.", o: ["Change one thing and retry", "Identify the file and line number above it", "Read the last line of the error", "Match the key words to a likely cause"], a: [2, 1, 3, 0], why: "Start with the last line, locate the place, interpret the wording, then make one change. Changing several things at once hides which one fixed it." },

    { q: "Your colleague's command  export API_KEY=abc  works on their Mac but gives a syntax error in your PowerShell. Why?", o: ["export is bash syntax; PowerShell uses $env:API_KEY = \"abc\"", "Your key is wrong", "PowerShell cannot hold environment variables", "Mac and Windows keys differ"], a: 0, why: "Shells are dialects. Use Git Bash to match bash-style commands, or translate to PowerShell syntax." },
    { q: "You type  python script.py  and get 'command not found: python' although you installed Python yesterday. First thing to check?", o: ["Reinstall Windows", "Whether the script is too long", "Whether the CSV is open", "Whether a new terminal is needed and whether Python's folder is on PATH (try which python)"], a: 3, why: "'Command not found' means the shell searched PATH and found nothing. A terminal opened before the install often has the old PATH." },
    { q: "What is the difference between an argument and a flag?", o: ["Flags are required, arguments are optional", "They are identical", "A flag is an option that starts with a dash and changes how the program behaves; arguments are the things it works on", "Flags only work in PowerShell"], a: 2, why: "In ls -l data, -l is a flag (an option) and data is an argument (what to list). Flags can take values, which can blur the line, but the idea holds." },
    { q: "Where is the file ../equipment.csv if you are in /work/fde-lab/data?", o: ["/work/fde-lab/data/equipment.csv", "/work/equipment.csv", "/work/fde-lab/equipment.csv", "/equipment.csv"], a: 2, why: ".. goes up from data to fde-lab, so the file is in fde-lab. People often forget that .. is relative to where you are, not to the file." },
    { q: "Your shell session has ANTHROPIC_API_KEY set with export. You close the terminal and open a new one. What happens to the variable?", o: ["It persists forever", "It is gone unless set in a profile or .env file loaded again", "It moves to the clipboard", "It is saved by Git"], a: 1, why: "export affects only the current shell session. Persistent settings go in a shell profile or a .env file your program loads. Secrets in files must also stay out of Git.", lvl: 2 },
    { q: "A tutorial says: curl https://example.com/install.sh | bash. Why should you pause before running it?", o: ["Pipes are slow", "It downloads and runs unreviewed code with your permissions", "curl is not installed on Windows", "bash cannot read stdin"], a: 1, why: "A pipe into bash executes whatever the server sends, as you. Download the script, read it, then run it, or use the vendor's documented installer.", lvl: 2 },
    { q: "A pipeline  cat equipment.csv | grep pump > pumps.txt  runs. What is on screen and where is the data?", o: ["The pump rows print on screen and nothing is saved", "Nothing prints; the pump rows are written to pumps.txt", "The whole CSV is printed and pumps.txt is empty", "An error, because > cannot follow a pipe"], a: 1, why: "The final > redirects the last command's stdout to the file, so the screen stays quiet. Redirects can end a pipeline.", lvl: 2 }

  id: "f2", code: "F2", track: "0 · Foundations", course: null,
  title: "Git and GitHub",
  mins: 75,
  why: "Claude Code edits your files fast, and git is how you keep that safe: every change is recorded, reviewable and reversible. An FDE who can read a diff critically and undo a bad change can let an AI write code without losing sleep.",
  objectives: [
    "Explain why version control exists using the plant idea of revision control",
    "Distinguish the working tree, the staging area and a commit",
    "Write a clear commit message and make a commit",
    "Read a diff line by line and spot risky or unrelated changes",
    "Create a branch, push it, and describe how a pull request review works",

  ],
  prereqs: ["f1"],
  cards: [
    { h: "Why version control: MOC for your files",
      b: "In a plant, a drawing change goes through <b>management of change</b>: who changed it, what changed, why, who approved, and the old revision is kept. <b>Git</b> does that for any folder of text files. Without it you get <code>report_final_v3_REAL.docx</code>. With it, every change has an author, a message, a date, and the previous version is one command away.<br>For AI work it is essential: Claude may change 12 files in one go. Git shows exactly what it changed and lets you reject it.",
      ex: "Revision C of the P&ID, with a change log and a way back to Revision B. Git is that for code and data.",
      check: { q: "Which plant practice is closest to what git gives you for files?", o: ["A permit-to-work", "Revision control with a change record on drawings", "A daily shift log", "A turnaround schedule"], a: 1, why: "Git keeps every revision, who made it, and why, and lets you compare or go back. That is revision control. Permits and logs do different jobs." } },
    { h: "Repo, working tree, staging area, commit",
      b: "A <b>repository (repo)</b> is a folder git is tracking, with its history in a hidden <code>.git</code> folder. Three places matter:<ul><li><b>Working tree</b>: the files as you see them now, including unsaved-to-git edits.</li><li><b>Staging area</b> (index): the changes you have selected for the next snapshot.</li><li><b>Commit</b>: a saved snapshot with a message, author and a unique ID (a hash like <code>a1b2c3d</code>).</li></ul>The staging step lets you commit a coherent set of changes, not everything at once. Think of it as clipping the pages that belong in one revision package.",
      code: `git init                 # make this folder a repo
git status               # what changed?
git add equipment.csv    # stage a file
git commit -m "Add equipment list"
git log --oneline        # history`,
      ex: "Edit three files, stage only the two that belong to the change, commit; the third stays out of this revision.",
      check: { q: "You edited two files but ran git add on only one. Then git commit. What is in the commit?", o: ["Both files", "Only the staged file", "Neither; git needs -a", "Only the newest file"], a: 1, why: "A commit contains what is staged. The other file stays modified in the working tree, uncommitted. git status shows the difference." } },
    { h: "Commit messages that help the next person",
      b: "A commit message is the change record. Say <b>what</b> and, when not obvious, <b>why</b>. First line short (about 50 characters), imperative mood: 'Add overdue filter', not 'stuff'. Small, single-purpose commits are easier to review and to undo.<br>Claude Code writes decent messages, but read them: they sometimes describe what it intended rather than what the diff does.",
      code: `# Weak
git commit -m "fixes"
# Better
git commit -m "Fix date parsing for blank last_inspection"
# With a reason
git commit -m "Skip rows with no tag" -m "Blank rows crashed the loader."`,
      ex: "'Raise PSV-3011 criticality to high' beats 'update data'." },
    { h: "Reading a diff: the key review skill",
      b: "A <b>diff</b> shows what changed. Lines starting with <code>-</code> were removed, <code>+</code> were added. The <code>@@</code> line says where. Run <code>git diff</code> (unstaged) or <code>git diff --staged</code> (about to commit).<br>When AI wrote the change, review like an inspector:<ul><li>Is every changed line related to the request?</li><li>Were tests or checks deleted or weakened?</li><li>Any new files, dependencies, keys or hard-coded values?</li><li>Did it fix the symptom or the cause?</li></ul>",
      code: `@@ -3,4 +3,4 @@ def is_overdue(row, today):
     if not row["last_inspection"]:
-        return True
+        return False
     return days_since(row) > 365`,
      ex: "The diff above quietly makes uninspected equipment 'not overdue'. A plausible-looking edit with a safety-relevant meaning flip.",
      check: { q: "In a diff, a line begins with a minus sign. What does that mean?", o: ["The line is a comment", "The line was removed in this change", "The line has an error", "The line is unchanged"], a: 1, why: "- marks removal and + marks addition. A changed line shows as one - and one +. Unchanged context lines have a leading space." } },
    { h: "Branches: a safe side road",
      b: "A <b>branch</b> is a separate line of work. <code>main</code> is the trusted line. You make a branch, change things there, and only join it back when it is reviewed. If the experiment goes wrong, delete the branch and main is untouched. This is exactly the isolation you want when an AI is making many edits.<br>Merging a branch brings its commits into another.",
      code: `git switch -c add-overdue-filter   # create and move
# ...edit, add, commit...
git switch main                    # go back
git branch                         # list branches
git branch -d add-overdue-filter   # delete when done`,
      ex: "Like a trial run on a temporary bypass line: the main line keeps running until you approve the change." },
    { h: "Merge vs rebase, at concept level",
      b: "Two ways to combine branches. <b>Merge</b> joins histories and records a merge commit; nothing is rewritten, the true history stays. <b>Rebase</b> replays your commits on top of the latest main, giving a straight line but <b>rewriting</b> those commits (new IDs).<ul><li>Beginner rule: merge, or let GitHub do it.</li><li>Never rebase commits other people already pulled.</li><li>If git reports a <b>conflict</b>, two changes touched the same lines. You pick the right text; Claude can help, but read the result.</li></ul>",
      ex: "A conflict is two engineers marking up the same line of the same drawing. A human must decide what the line says." },
    { h: "Remotes, push and pull; GitHub",
      b: "A <b>remote</b> is another copy of the repo, usually on <b>GitHub</b> (a hosting service; git itself works with no internet). <code>git push</code> sends your commits to the remote. <code>git pull</code> brings others' commits down. <code>git clone</code> copies a repo for the first time. The usual name for the main remote is <code>origin</code>.<br>A <b>private</b> repo is visible only to people you invite. Treat anything pushed to a public repo as published forever.",
      code: `git remote add origin https://github.com/YOU/fde-lab.git
git push -u origin main
git pull
# or let the GitHub CLI do it:
gh repo create fde-lab --private --source=. --push`,
      ex: "Push is like filing the revision to the document control system; pull is checking for new revisions." },
    { h: "Pull requests and review",
      b: "A <b>pull request (PR)</b> says: 'please merge my branch into main'. On GitHub it shows the diff, a discussion, and automated checks. A reviewer approves, asks for changes, or rejects. Description matters: say what, why, how you tested.<br>For FDE work, a PR is your unit of delivery and your safety net: nothing reaches main without a second look, even if Claude wrote it. You can review your own PR as practice by reading the diff tab top to bottom.",
      ex: "PR title: 'Add overdue-inspection filter'. Body: why, how to test, known gaps.",
      check: { q: "What is the main purpose of a pull request in a team?", o: ["To back up files", "To propose a change and have it reviewed before it joins main", "To delete a branch", "To speed up git"], a: 1, why: "A PR is a review gate around a diff. Backup is a side effect of pushing; the point is review and discussion before merge." } },
    { h: ".gitignore and never committing secrets",
      b: "<code>.gitignore</code> lists files git must not track: <code>.env</code> (API keys), <code>node_modules/</code>, <code>__pycache__/</code>, data you cannot share. <b>Git remembers forever.</b> If you commit a key then delete it in the next commit, it is still in history, and if pushed to GitHub bots find it within minutes. Fix: <b>revoke the key</b> at the provider, make a new one, then clean history if needed.<br>Rule: add the ignore line <i>before</i> the first commit.",
      code: `# .gitignore
.env
*.key
__pycache__/
data/private/
.venv/`,
      ex: "Real company data and real keys never go into fde-lab. Only the fake Northfield data does." },
    { h: "Undoing safely",
      b: "Match the tool to the situation:<ul><li>Edited a file, want it back: <code>git restore file</code> (discards your edits).</li><li>Staged by mistake: <code>git restore --staged file</code>.</li><li>Bad commit already shared: <code>git revert &lt;hash&gt;</code> adds a new commit that undoes it. History stays honest.</li><li>Local commit, not pushed, want it gone: <code>git reset</code>. With <code>--hard</code> it also throws away working edits, so be careful.</li></ul>Shared history: prefer <b>revert</b>. Local mess: <b>reset</b> is fine. Claude Code also has a rewind feature for its own edits, but git is your durable safety net.",
      code: `git restore equipment.csv
git restore --staged equipment.csv
git revert a1b2c3d
git reset --soft HEAD~1   # undo commit, keep changes`,
      ex: "Revert is issuing a new revision that cancels the old one. Reset is pretending the old revision never existed.",
      check: { q: "A bad commit has already been pushed and teammates pulled it. Safest way to undo?", o: ["git reset --hard and force push", "git revert the commit", "Delete the repo", "git restore the file"], a: 1, why: "revert adds a new commit that cancels the old one, so shared history stays consistent. Resetting and force pushing rewrites history others already have." } },
    { h: "How Claude Code uses git",
      b: "Claude Code reads <code>git status</code> and <code>git diff</code> to understand your work, and can make commits and branches for you when asked. It may also open a PR through the GitHub CLI. Habits that keep you in control:<ul><li>Commit before a big Claude task so you can see exactly what it changed.</li><li>Work on a branch.</li><li>Run <code>git diff</code> and read it before accepting a commit.</li><li>Never let it commit <code>.env</code> or push to main unreviewed.</li></ul>" }
  ],

    { q: "A teammate committed .env with a live API key and pushed to GitHub. They deleted the file in the next commit. Is the key safe?", o: ["Yes, the file is gone", "Yes, if the repo is private", "No; it remains in history, so revoke the key and issue a new one", "Yes, after git pull"], a: 2, why: "History keeps every version. Deleting later does not remove it. Revoke the key first, then deal with history. Private repos reduce risk but do not make a leaked key safe." },
    { q: "Which diff hunk should make a reviewer stop and ask questions?", code: "-    assert overdue(row) is True\n+    pass\n     return result", o: ["A comment typo fix", "A renamed variable", "A test assertion replaced with pass", "A blank line added"], a: 2, why: "Replacing an assertion with pass silences the check without fixing anything. AI tools sometimes 'make tests pass' this way. Always ask why a check changed." },
    { q: "Which statements are true about staging? Select all that apply.", o: ["git add moves selected changes into the staging area", "A commit records what is staged", "Staging lets you split edits into separate commits", "Staging uploads files to GitHub"], a: [0, 1, 2], why: "Staging is a local selection step. Uploading is push. Git status shows staged and unstaged sets separately." },
    { t: "order", q: "Put the flow of a normal change in order.", o: ["Open a pull request", "Edit files on the branch", "git commit", "git switch -c new-branch", "git push"], a: [3, 1, 2, 4, 0], why: "Branch first, edit, commit, push the branch to the remote, then open the PR for review. Branching after editing works too but creating it first keeps main clean." },
    { q: "Claude Code finished a 15-file refactor and you do not like it. You had committed beforehand and have not committed since. Cleanest recovery?", o: ["git restore . to discard working changes (after checking git status)", "Ask Claude to remember the old code", "Delete the folder and start over", "git revert HEAD"], a: 0, why: "Because the earlier commit was clean, restoring the working tree returns you to it. Revert undoes a commit that exists; there is no new commit here. Always check git status first so you do not discard other work. Brand-new files Claude created are untracked and restore will not remove them; delete those by hand." },
    { q: "When is rebase risky?", o: ["When commits are only on your laptop", "When you use a branch", "When the repo is private", "When others have already pulled those commits"], a: 3, why: "Rebase rewrites commit IDs. If teammates already have the old commits, histories diverge and cause confusing conflicts. For unshared work it is fine." },
    { q: "In a PR, you notice the diff also changed package files and a config you never asked about. What do you do?", o: ["Ask why those files changed, or split them into a separate change", "Approve, since tests pass", "Merge and fix later", "Ignore them; config files do not matter"], a: 0, why: "Unrequested changes widen risk and hide in large diffs. Keep the PR scoped. Passing tests only proves what is tested." },

  id: "f3", code: "F3", track: "0 · Foundations", course: null,
  title: "JSON, HTTP and APIs",
  mins: 80,
  why: "Every Claude integration is JSON over HTTP: your request, the model's response, tool calls, structured outputs. If you can read both and recognize a 401 from a 429, you can debug at the wire when the SDK or a framework hides what is happening.",
  objectives: [

  ],
  prereqs: ["f1"],
  cards: [
    { h: "JSON: the language programs use to hand data to each other",
      b: "<b>JSON</b> (JavaScript Object Notation) is text that holds structured data. Six types only:<ul><li><b>string</b> <code>\"P-301A\"</code> (double quotes always)</li><li><b>number</b> <code>42</code>, <code>3.5</code></li><li><b>boolean</b> <code>true</code> / <code>false</code></li><li><b>null</b> (nothing)</li><li><b>object</b> <code>{\"key\": value}</code> (named fields)</li><li><b>array</b> <code>[a, b, c]</code> (ordered list)</li></ul>Objects and arrays nest. Strict rules: double quotes, no trailing commas, no comments. One stray comma breaks the whole document.",
      code: `{
  "tag": "P-301A",
  "type": "pump",
  "high_criticality": true,
  "last_inspection": "2025-03-12",
  "open_work_orders": [4412, 4419],
  "spare": null
}`,
      ex: "A CSV row is flat. JSON can hold a list of work orders inside an equipment record.",
      check: { q: "Which of these is valid JSON?", o: ["{tag: 'P-301A'}", "{\"tag\": \"P-301A\",}", "{\"tag\": \"P-301A\"}", "{\"tag\" = \"P-301A\"}"], a: 2, why: "JSON needs double-quoted keys and strings, a colon, and no trailing comma. The first uses single quotes and bare keys, the second has a trailing comma, the fourth uses = instead of a colon." } },
    { h: "Reading nested JSON",
      b: "Read by walking a path. Objects are reached by key, arrays by position (starting at <b>0</b>). Say the path out loud: 'the response, its first content block, its text'. Tools like <code>jq</code> automate it, and code uses the same idea: <code>data[\"items\"][0][\"tag\"]</code>.<br>Tip: when a long JSON blob confuses you, find the outermost brackets first. <code>{</code> means an object of named fields, <code>[</code> means a list.",
      code: `{
  "unit": "U300",
  "items": [
    {"tag": "P-301A", "checks": [{"year": 2025, "ok": true}]},
    {"tag": "E-301",  "checks": []}
  ]
}
# (the two lines below are notes, not JSON)
# items[0].checks[0].year  ->  2025
# items[1].checks          ->  [] (empty list)`,
      ex: "'First item, its checks, first check, year' is the path items[0].checks[0].year.",
      check: { q: "In the JSON above, what is items[1].tag?", o: ["P-301A", "E-301", "U300", "It does not exist"], a: 1, why: "Arrays count from 0, so items[1] is the second element, the E-301 record. Off-by-one confusion over 0 versus 1 is the most common slip." } },
    { h: "JSON Schema: a contract for JSON",
      b: "A <b>JSON Schema</b> is itself a JSON document that describes what valid JSON looks like. Claude's structured outputs and tool definitions use it, so you need the basics:<ul><li><code>type</code>: string, number, integer, boolean, object, array</li><li><code>properties</code>: the fields of an object and their schemas</li><li><code>required</code>: field names that must be present</li><li><code>enum</code>: the only allowed values</li><li><code>additionalProperties: false</code>: no extra fields allowed</li></ul>It works like an inspection checklist: every record must have these fields, with these allowed values.",
      code: `{
  "type": "object",
  "properties": {
    "tag": {"type": "string"},
    "criticality": {
      "type": "string",
      "enum": ["high", "medium", "low"]
    }
  },
  "required": ["tag", "criticality"],
  "additionalProperties": false
}`,
      ex: "A record with criticality 'urgent' fails the enum. A record with a surprise field 'color' fails additionalProperties.",
      check: { q: "Which keyword stops a record from containing fields you did not define?", o: ["required", "enum", "additionalProperties: false", "type"], a: 2, why: "additionalProperties: false rejects unlisted fields. required only forces certain fields to be present. Claude's structured outputs expect additionalProperties: false on objects." } },
    { h: "What an API is",
      b: "An <b>API</b> (application programming interface) is a defined way for one program to ask another to do something. A <b>web API</b> lives at a URL: you send a request, you get a response. Your program does not need to know how the service works inside, only the request and response format.<br>Plant analogy: a field instrument's datasheet. You do not open the transmitter; you know the range, the signal and the wiring.",
      ex: "The Claude API is: send a JSON message to a URL with your key, get a JSON reply." },
    { h: "Anatomy of an HTTP request",
      b: "<b>HTTP</b> is how web requests travel. A request has four parts:<ul><li><b>Method</b>: GET (read), POST (send/create), PUT/PATCH (update), DELETE.</li><li><b>URL</b>: where, e.g. <code>https://api.anthropic.com/v1/messages</code>.</li><li><b>Headers</b>: labeled metadata: who you are, what format.</li><li><b>Body</b>: the content (JSON for most APIs).</li></ul>The response has a <b>status code</b>, headers and a body. HTTP is <b>stateless</b>: each request stands alone, which is why a chat with Claude must resend the conversation each time.",
      code: `POST /v1/messages HTTP/1.1
Host: api.anthropic.com
x-api-key: sk-ant-...
anthropic-version: 2023-06-01
content-type: application/json

{"model": "claude-haiku-5-5", "max_tokens": 300, ...}`,
      ex: "Like a transmittal: header block (to, from, doc number) plus the attached document (body)." },
    { h: "Status codes: what the server is telling you",
      b: "The first digit tells the family: <b>2xx</b> success, <b>4xx</b> your request has a problem, <b>5xx</b> the server has a problem.<ul><li><b>200</b> OK</li><li><b>400</b> bad request: malformed JSON or invalid field. Read the error body.</li><li><b>401</b> unauthorized: missing or wrong API key</li><li><b>403</b> forbidden: key valid but not allowed this</li><li><b>404</b> not found: wrong URL or model name</li><li><b>429</b> too many requests: rate limit; slow down and retry</li><li><b>500</b> server error: not your fault, retry</li><li><b>529</b> overloaded: Anthropic is busy; retry later with backoff</li></ul>",
      ex: "A 401 means fix your key. A 529 means wait and retry; changing your code will not help.",
      check: { q: "Your call returns 401. What is the most likely problem?", o: ["Too many requests", "The server crashed", "The API key is missing, wrong or revoked", "The JSON body is too large"], a: 2, why: "401 means authentication failed. 429 is rate limiting, 500/529 are server-side, 400 is a malformed request." } },
    { h: "API keys are secrets",
      b: "An <b>API key</b> identifies and bills you. Anyone holding it can spend your money and act as you. Rules:<ul><li>Keep it in an environment variable or a <code>.env</code> file listed in <code>.gitignore</code>. Never in code, never in a commit, never in a screenshot or chat.</li><li>Send it in the <code>x-api-key</code> header, over HTTPS only.</li><li>One key per project so you can revoke one without breaking others.</li><li>If leaked: revoke in the Console first, then create a new one.</li></ul>",
      code: `# Bash: set for this terminal session only
export ANTHROPIC_API_KEY="sk-ant-...your-key..."
# check it exists WITHOUT printing it
[ -n "$ANTHROPIC_API_KEY" ] && echo "key is set"`,
      ex: "Treat a key like a master key for the plant gate: sign for it, never copy it onto a sticky note.",
      check: { q: "Where should an API key live in a project you will commit to GitHub?", o: ["Hard-coded in the script for convenience", "In README.md so teammates find it", "In an environment variable or a .env file that is git-ignored", "In the commit message"], a: 2, why: "Secrets stay out of tracked files. A .env file that is ignored by git, or an environment variable, keeps the key local." } },
    { h: "curl: make an HTTP request from the terminal",
      b: "<code>curl</code> sends HTTP requests from the shell. Key flags: <code>-X</code> method (POST is implied with <code>-d</code>), <code>-H</code> a header, <code>-d</code> the body, <code>-i</code> show response headers, <code>-s</code> silent. A trick for long JSON: put it in a file and use <code>-d @request.json</code>, which avoids shell quoting problems.<br>On Windows use Git Bash. Its quoting rules differ from PowerShell's, and curl commands in docs assume bash.",
      code: `curl -i https://api.anthropic.com/v1/messages
# no key, no body: expect a 4xx. That still proves
# your network and curl work.`,
      ex: "A failing curl is still information: the status code and error body tell you what to fix." },
    { h: "The Claude Messages API with curl",
      b: "Three headers: <code>x-api-key</code>, <code>anthropic-version: 2023-06-01</code> (still accepted; newer versions such as 2026-10-21 exist and change a few fields, see P1), <code>content-type: application/json</code>. Body fields: <code>model</code>, <code>max_tokens</code> (cap on the reply), <code>messages</code> (list of role/content turns). The API is stateless: you send the whole conversation each time.<br>Save the body in <code>request.json</code> first, then:",
      code: `# request.json

}

curl https://api.anthropic.com/v1/messages \\

      ex: "Haiku is the cheapest, fastest model: a call like this costs a fraction of a cent." },
    { h: "Reading the response",
      b: "The reply is JSON. The fields you need first:<ul><li><code>content</code>: a <b>list of blocks</b>. A text reply is <code>content[0].text</code>. Later, tool calls appear here as <code>tool_use</code> blocks.</li><li><code>stop_reason</code>: why it stopped. <code>end_turn</code> = finished naturally; <code>max_tokens</code> = cut off by your cap (raise it); <code>tool_use</code> = Claude wants a tool run.</li><li><code>usage</code>: <code>input_tokens</code> and <code>output_tokens</code>, which is what you are billed on.</li></ul>An error comes back as JSON too, with a <code>type: \"error\"</code> body you should read.",
      code: `{
  "id": "msg_01...",

  "role": "assistant",

    "text": "PSVs protect equipment from overpressure..."}],

      ex: "If the answer ends mid-sentence, check stop_reason: it is probably max_tokens.",

    { h: "Rate limits and retries",
